# Build the site for the library server (ulblwebp20) and publish it as a GitHub release.
# The server installs a release with deploy/deploy-portfolio.sh; see deploy/README.md.
#
# Built here rather than on the server: a build needs 2-3 GB of memory, which the server (shared with
# other sites) does not have to spare, and the image library (sharp) must be the Linux build.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: --no-deprecation
      # The build reads the database to render the not-found page, and migrations change it.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Needed to start Payload during the build; the server uses its own secret at runtime.
      PAYLOAD_SECRET: build-time-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the database secret is set
        run: test -n "$DATABASE_URL" || { echo "Add the DATABASE_URL secret (Settings -> Secrets and variables -> Actions)."; exit 1; }

      - run: pnpm test:unit

      - name: Apply database migrations
        run: pnpm payload migrate
        env:
          NODE_ENV: production

      - run: pnpm build

      - name: Package
        run: deploy/package.sh dist

      - name: Make sure no secret is in the package
        run: |
          password=$(node -e 'console.log(decodeURIComponent(new URL(process.env.DATABASE_URL).password))')
          if grep -rqF -- "$DATABASE_URL" dist/app || { [ -n "$password" ] && grep -rqF -- "$password" dist/app; }; then
            echo "The database address or password was found in the build. Not publishing."; exit 1
          fi
          if find dist/app -path dist/app/node_modules -prune -o -name '.env*' -print | grep -q .; then
            echo "An .env file is in the build. Not publishing."; exit 1
          fi

      - name: Rehearse the deploy on a copy of the server setup
        run: deploy/test-deploy.sh dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          git log -1 --pretty='%s%n%n%b' > notes.txt
          printf '\nInstall on the server: sudo /opt/next_js/daaho/deploy-portfolio.sh %s\n' "$tag" >> notes.txt
          gh release create "$tag" dist/daaho-portfolio.tar.gz dist/daaho-portfolio.tar.gz.sha256 deploy/deploy-portfolio.sh \
            --title "$tag" --notes-file notes.txt --latest

      - name: Keep the 15 most recent releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[15:] | .[].tagName' \
            | { grep '^build-' || true; } | while read -r t; do gh release delete "$t" --yes --cleanup-tag; done
